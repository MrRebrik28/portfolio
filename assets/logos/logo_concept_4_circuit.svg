  <!-- Terminal Circuit Nodes -->
  <circle cx="72" cy="16" r="4" fill="#0B0E14" stroke="#B3F77D" stroke-width="2.5"/>
  <circle cx="72" cy="84" r="4" fill="#0B0E14" stroke="#B3F77D" stroke-width="2.5"/>
  <circle cx="24" cy="84" r="4" fill="#0B0E14" stroke="#B3F77D" stroke-width="2.5"/>
