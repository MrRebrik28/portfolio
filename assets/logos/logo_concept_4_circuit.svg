  <circle cx="50" cy="50" r="42" stroke="rgba(179,247,125,0.08)" stroke-dasharray="2 4"/>
  <!-- Right Stem Track -->
  <path d="M72 16v68" stroke="#B3F77D" stroke-width="7" stroke-linecap="round"/>
